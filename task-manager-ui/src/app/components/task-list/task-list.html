<h2>Mes tâches</h2>

@for (task of tasks; track task.id) {
  <div class="task" [class.done]="task.completed">
    <h3>{{ task.title }}</h3>
    @if (task.description) {
      <p>{{ task.description }}</p>
    }
    <small>Créée le {{ task.createdAt | date: 'dd/MM/yyyy' }}</small>
    <span class="status">{{ task.completed ? 'Terminée' : 'En cours' }}</span>
  </div>
} @empty {
  <p>Aucune tâche.</p>
}
